[package]
name = "mcf-checks"
description = "Workspace-shape checks: the crate split, the dependency direction, and the toolchain pin (B-001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]

# A13 makes the taxonomy and the code one list. Reading it needs the types, so
# the checks take mcf-core as a development dependency only — nothing this
# crate builds is shipped, and no MCF crate depends on it.
[dev-dependencies]
mcf-core = { path = "../crates/mcf-core" }
