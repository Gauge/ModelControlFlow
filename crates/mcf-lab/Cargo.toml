[package]
name = "mcf-lab"
description = "The laboratory: simulated clock, injected faults, replayable scenarios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mcf-core = { path = "../mcf-core" }
mcf-record = { path = "../mcf-record" }
# A13: every category MCF's code constructs has a scenario that produces it, and
# the model-file reader constructs two. A scenario that built those failures by
# hand would be a scenario about a mock (D26).
mcf-standin = { path = "../mcf-standin" }
# The same reason: a reference MCF refuses is a category its code constructs,
# and a scenario that built that failure by hand would be about a mock.
mcf-helper = { path = "../mcf-helper" }
mcf-hub = { path = "../mcf-hub" }
mcf-serve = { path = "../mcf-serve" }
