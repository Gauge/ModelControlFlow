
[workspace]
resolver = "3"
members = [
    "crates/mcf-core",
    "crates/mcf-record",
    "crates/mcf-standin",
    "crates/mcf-helper",
    "crates/mcf-hub",
    "crates/mcf-optimize",
    "crates/mcf-serve",
    "crates/mcf-desk",
    "crates/mcf-tui",
    "crates/mcf-cli",
    "checks",
    "prototypes/adversarial",
    "prototypes/kernel-slope",
    "prototypes/thread-scaling",
]

[workspace.package]
version = "0.2.2-m1"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-3.0-only"

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
integer_division = "deny"
let_underscore_must_use = "deny"
exit = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false
incremental = false
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.dev.package.mcf-desk]
opt-level = 3
