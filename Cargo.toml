# The MCF workspace (B-001).
#
# Every crate here is a member of one workspace with one lockfile, because
# §3.12 makes reproducibility a precedence rule (P3) and independent lockfiles
# are independent sets of conditions. The crate split is a boundary, not a
# packaging convenience: it is how §3.16's "make illegal states
# unrepresentable" is applied above the type level, since a dependency edge
# that does not exist cannot be taken by a tired author at the end of a long
# change.

[workspace]
resolver = "3"
members = [
    "crates/mcf-core",
    "crates/mcf-record",
    "crates/mcf-lab",
    "crates/mcf-hub",
    "crates/mcf-serve",
    "crates/mcf-bench",
    "crates/mcf-cli",
    "checks",
]

[workspace.package]
version = "0.1.0-m0"
edition = "2024"
rust-version = "1.98.0"
license = "AGPL-3.0-only"
repository = "https://github.com/Gauge/ModelControlFlow"
authors = ["The MCF authors"]

# No workspace dependencies. B15 admits weight only against a stated cost, and
# at M0 nothing has stated one. Every dependency added here carries its
# justification in doc/dependencies.md before it is admitted.
[workspace.dependencies]

# Lints applied to every member. These are the machine-checked form of rules
# that would otherwise rest on review (B16).
[workspace.lints.rust]
# §3.16: a memory-safety escape hatch is exactly the kind of discipline that
# erodes. Denied rather than forbidden so that the C-ABI work D4 anticipates
# can opt in per module, with the reason written at the opt-in site.
unsafe_code = "deny"
# A23: work cites intent. An undocumented public item is a boundary nobody
# justified.
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# A2 forbids the silent failure and the dishonest crash alike. B-003 makes the
# error type that replaces these; the lints exist from the first commit so that
# no code is written under the old habit and migrated later.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
integer_division = "deny"
# A6: measurements carry conditions. Silent numeric truncation is how a
# condition-carrying value becomes a bare one.
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# Release profile. `panic = "abort"` follows A2: a panic is an
# `internal.invariant_violated` that the type system was meant to prevent, and
# unwinding past it invites the bare catch-and-continue A2 calls worse than a
# crash. `debug = false` and `strip` keep the core binary inside D24's 40 MiB.
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false
incremental = false
overflow-checks = true

# Overflow checks stay on in release: an arithmetic overflow that wraps is a
# wrong number, and P1 puts honesty above continuity. The cost is a branch per
# arithmetic operation, which D24's budgets are measured against rather than
# assumed to be free.

[profile.dev]
panic = "abort"
overflow-checks = true

# Cargo forces the test and bench profiles to unwind whatever the dev profile
# says, because the harness catches a failing assertion. That is the one place
# where what the suite runs and what MCF ships genuinely differ, and it is why
# B-011's budget suite measures the release artifact rather than the test one.
